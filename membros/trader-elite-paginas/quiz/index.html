<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trader Elite — Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10141c;          /* base — deep ink with real blue hue, not fake-black */
    --ink-2:#161c27;        /* elevated surface */
    --ink-3:#1e2634;        /* card resting */
    --line:#2a3342;         /* hairlines / borders */
    --line-2:#37435729;     /* faint */
    --text:#ece7dd;         /* warm off-white */
    --muted:#8b95a6;        /* cool grey */
    --muted-2:#606b7d;
    --brass:#cfa155;        /* the one bold thing */
    --brass-soft:#cfa15522;
    --brass-line:#cfa15555;
    --ok:#7fb08a;
    --r:14px;
    --maxw:520px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;
    min-height:100dvh;
  }
  /* subtle depth behind the funnel, not decorative noise */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(120% 60% at 50% -10%, #1a2534 0%, transparent 55%),
      radial-gradient(90% 50% at 50% 120%, #14110c 0%, transparent 50%);
    opacity:.6;
  }
  .app{
    position:relative;width:100%;max-width:var(--maxw);
    display:flex;flex-direction:column;
    padding:0 20px;
    min-height:100dvh;
  }

  /* ---- top bar ---- */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 0 14px;
  }
  .brand{display:flex;align-items:center;gap:9px;font-family:'Archivo';font-weight:800;
    letter-spacing:-.01em;font-size:15px}
  .brand .mark{width:15px;height:15px;border:1.5px solid var(--brass);
    transform:rotate(45deg);border-radius:2px}
  .back{background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;
    padding:6px 8px;border-radius:8px;font-family:inherit}
  .back:hover{color:var(--text)}
  .back[hidden]{visibility:hidden}

  /* ---- progress ---- */
  .progress{height:3px;background:var(--line);border-radius:99px;overflow:hidden}
  .progress > i{display:block;height:100%;width:0;background:var(--brass);
    border-radius:99px;transition:width .45s cubic-bezier(.22,1,.36,1)}
  .stepnote{font-size:12px;color:var(--muted-2);margin-top:10px;letter-spacing:.02em}

  /* ---- stage ---- */
  main{flex:1;display:flex;flex-direction:column;justify-content:center;
    padding:26px 0}
  .step{animation:enter .4s cubic-bezier(.22,1,.36,1)}
  @keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){
    .step{animation:none}
    .progress > i{transition:none}
  }

  .q-kicker{font-size:13px;color:var(--brass);font-weight:500;margin-bottom:12px}
  h1{font-family:'Archivo';font-weight:800;font-size:clamp(24px,6.4vw,31px);
    line-height:1.12;letter-spacing:-.02em;margin-bottom:6px}
  .sub{color:var(--muted);font-size:15px;margin-bottom:24px}

  .options{display:flex;flex-direction:column;gap:11px}
  .opt{
    display:flex;align-items:center;gap:14px;
    background:var(--ink-3);border:1px solid var(--line);
    color:var(--text);text-align:left;
    padding:17px 16px;border-radius:var(--r);font-size:16px;font-weight:500;
    cursor:pointer;font-family:inherit;width:100%;
    transition:border-color .15s,background .15s,transform .06s;
  }
  .opt:hover{border-color:var(--brass-line)}
  .opt:active{transform:scale(.99)}
  .opt:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .opt .dot{flex:none;width:20px;height:20px;border-radius:50%;
    border:1.5px solid var(--muted-2);transition:.15s}
  .opt.sel{border-color:var(--brass);background:var(--brass-soft)}
  .opt.sel .dot{border-color:var(--brass);background:var(--brass);
    box-shadow:inset 0 0 0 3px var(--ink-3)}

  /* ---- capture form ---- */
  .field{margin-bottom:15px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}
  input[type=text],input[type=tel]{
    width:100%;background:var(--ink-3);border:1px solid var(--line);
    border-radius:var(--r);color:var(--text);font-size:16px;font-family:inherit;
    padding:15px 16px;transition:border-color .15s;
  }
  input::placeholder{color:var(--muted-2)}
  input:focus{outline:none;border-color:var(--brass)}
  .consent{display:flex;gap:11px;align-items:flex-start;margin:18px 0 4px;
    font-size:13px;color:var(--muted);line-height:1.45}
  .consent input{flex:none;width:19px;height:19px;margin-top:1px;accent-color:var(--brass)}
  .consent a{color:var(--text);text-decoration:underline;text-underline-offset:2px}
  .err{color:#e0876f;font-size:13px;margin-top:8px;min-height:0}

  /* ---- primary cta ---- */
  .cta{
    width:100%;background:var(--brass);color:#1a1206;border:0;
    font-family:'Archivo';font-weight:700;font-size:16.5px;letter-spacing:-.01em;
    padding:17px;border-radius:var(--r);cursor:pointer;margin-top:18px;
    transition:filter .15s,transform .06s;
  }
  .cta:hover{filter:brightness(1.06)}
  .cta:active{transform:scale(.99)}
  .cta:disabled{opacity:.4;cursor:not-allowed}
  .cta.ghost{background:none;color:var(--muted);border:1px solid var(--line);
    font-family:'Inter';font-weight:600;font-size:15px;margin-top:11px}
  .cta.ghost:hover{color:var(--text);filter:none}

  /* ---- result ---- */
  .badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;
    color:var(--brass);border:1px solid var(--brass-line);border-radius:99px;
    padding:6px 13px;margin-bottom:18px}
  .badge .mark{width:8px;height:8px;background:var(--brass);transform:rotate(45deg)}
  .result-card{background:var(--ink-2);border:1px solid var(--line);
    border-radius:18px;padding:22px 20px;margin-top:4px}
  .result-card p{color:var(--muted);font-size:15px;margin-top:10px}
  .perks{list-style:none;margin-top:18px;display:flex;flex-direction:column;gap:11px}
  .perks li{display:flex;gap:11px;font-size:14.5px;color:var(--text);align-items:flex-start}
  .perks .tick{color:var(--brass);flex:none;font-weight:700}

  /* ---- footer / compliance ---- */
  footer{padding:16px 0 22px;border-top:1px solid var(--line);margin-top:20px}
  .risk{font-size:11.5px;color:var(--muted-2);line-height:1.5}
  .risk b{color:var(--muted);font-weight:600}
  a.cta{display:block;text-align:center;text-decoration:none;box-sizing:border-box}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="mark"></span>Trader Elite</div>
    <button class="back" id="back" hidden>Voltar</button>
  </header>

  <div class="progress"><i id="bar"></i></div>
  <div class="stepnote" id="stepnote"></div>

  <main id="stage"></main>

  <footer>
    <p class="risk"><b>Conteúdo educacional.</b> Nada aqui é recomendação de investimento.
    Operar no mercado financeiro envolve risco de perda. Resultados passados não garantem resultados futuros.</p>
  </footer>
</div>

<script>
/* ============================================================
   TRACKING — STUB
   Aqui é onde, na versão de produção, cada evento dispara no
   Pixel (browser) e é espelhado na API de Conversão (server)
   usando o MESMO event_id para deduplicação.
   Por enquanto só empurra pro dataLayer + console pra inspeção.
   ============================================================ */
window.dataLayer = window.dataLayer || [];
function track(event, data){
  const payload = { event, ...data };
  window.dataLayer.push(payload);
  console.log('[track]', payload);
}
function newEventId(){
  return (crypto.randomUUID ? crypto.randomUUID() : 'te_'+Date.now()+Math.random());
}

/* ============================================================
   QUIZ — perfis de qualificação (sem qualquer sugestão de retorno)
   ============================================================ */
const QUESTIONS = [
  { key:'nivel', kicker:'Pergunta 1 de 4',
    title:'Qual seu nível com trading hoje?',
    options:[
      {v:'zero',  t:'Nunca operei'},
      {v:'inicio',t:'Já fiz algumas operações'},
      {v:'ativo', t:'Opero com frequência'},
      {v:'exp',   t:'Opero há anos'},
    ]},
  { key:'atual', kicker:'Pergunta 2 de 4',
    title:'Você está operando atualmente?',
    options:[
      {v:'semana',t:'Sim, toda semana'},
      {v:'asvezes',t:'De vez em quando'},
      {v:'parei', t:'Parei por enquanto'},
      {v:'nao',   t:'Ainda não comecei'},
    ]},
  { key:'objetivo', kicker:'Pergunta 3 de 4',
    title:'O que você quer da comunidade?',
    options:[
      {v:'zero',    t:'Aprender do zero'},
      {v:'consist', t:'Ganhar consistência'},
      {v:'aprender',t:'Aprender com quem já opera há tempo'},
      {v:'rede',    t:'Trocar ideia e ir a eventos'},
    ]},
  { key:'dificuldade', kicker:'Pergunta 4 de 4',
    title:'Qual sua maior dificuldade agora?',
    options:[
      {v:'comeco', t:'Não sei por onde começar'},
      {v:'metodo', t:'Me falta um método'},
      {v:'emocao', t:'Controle emocional'},
      {v:'tempo',  t:'Tempo pra estudar'},
      {v:'fonte',  t:'Achar conteúdo confiável'},
    ]},
];

/* segmentação → perfil (linguagem sóbria, sem promessa de ganho) */
function resolveProfile(a){
  if(a.nivel==='zero' || a.objetivo==='zero' || a.dificuldade==='comeco'){
    return {
      name:'Perfil Fundação',
      line:'Você está começando — e do jeito certo: perto de quem já operou de verdade, sem atalho e sem promessa.',
      perks:[
        'Trilha inicial em vídeo, aberta, pra entender o mercado do zero',
        'Acompanhamento de traders experientes explicando cada passo',
        'Uma base sólida antes de arriscar qualquer valor',
      ]};
  }
  if(a.nivel==='exp' || a.objetivo==='rede' || a.objetivo==='aprender'){
    return {
      name:'Perfil Mesa',
      line:'Seu foco é troca de alto nível: conviver com quem está no mercado há anos e trocar leitura de verdade.',
      perks:[
        'Acesso aos perfis dos traders e à biblioteca completa de estudos',
        'Convite prioritário para os eventos presenciais',
        'Discussões de método com quem opera há tempo',
      ]};
  }
  return {
    name:'Perfil Consistência',
    line:'Você já opera — o que falta é método e disciplina. É exatamente aí que a comunidade trabalha.',
    perks:[
      'Estudos focados em processo, gestão de risco e rotina',
      'Vídeos de traders experientes revisando decisões reais',
      'Um grupo pra manter a consistência sem operar no escuro',
    ]};
}

/* ============================================================
   STATE + RENDER
   ============================================================ */
const state = { step:0, answers:{}, started:false };
const stage = document.getElementById('stage');
const bar = document.getElementById('bar');
const stepnote = document.getElementById('stepnote');
const backBtn = document.getElementById('back');
const TOTAL = QUESTIONS.length + 1; // perguntas + captura

function setProgress(){
  const pct = Math.min(100, (state.step / TOTAL) * 100);
  bar.style.width = pct + '%';
  backBtn.hidden = state.step === 0;
  if(state.step < QUESTIONS.length){
    stepnote.textContent = '';
  } else {
    stepnote.textContent = '';
  }
}

function render(){
  setProgress();
  if(state.step < QUESTIONS.length){ renderQuestion(QUESTIONS[state.step]); }
  else if(state.step === QUESTIONS.length){ renderCapture(); }
  else { renderResult(); }
}

function renderQuestion(q){
  const chosen = state.answers[q.key];
  stage.innerHTML = `
    <div class="step">
      <div class="q-kicker">${q.kicker}</div>
      <h1>${q.title}</h1>
      <div class="options" role="radiogroup" aria-label="${q.title}">
        ${q.options.map(o=>`
          <button class="opt ${chosen===o.v?'sel':''}" role="radio"
            aria-checked="${chosen===o.v}" data-v="${o.v}">
            <span class="dot"></span><span>${o.t}</span>
          </button>`).join('')}
      </div>
    </div>`;
  stage.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click',()=>{
      state.answers[q.key] = btn.dataset.v;
      stage.querySelectorAll('.opt').forEach(b=>{
        b.classList.toggle('sel', b===btn);
        b.setAttribute('aria-checked', b===btn);
      });
      // auto-avança — fluido no mobile
      setTimeout(()=>{ state.step++; render(); }, 260);
    });
  });
}

function renderCapture(){
  stage.innerHTML = `
    <div class="step">
      <div class="q-kicker">Último passo</div>
      <h1>Seu perfil está pronto.</h1>
      <p class="sub">Falta só pra onde enviamos o seu convite.</p>
      <div class="field">
        <label for="nome">Seu nome</label>
        <input type="text" id="nome" autocomplete="given-name" placeholder="Como podemos te chamar">
      </div>
      <div class="field">
        <label for="zap">WhatsApp</label>
        <input type="tel" id="zap" inputmode="numeric" autocomplete="tel" placeholder="(DDD) 9 0000-0000">
      </div>
      <label class="consent">
        <input type="checkbox" id="lgpd">
        <span>Autorizo o contato pelo WhatsApp e o uso dos meus dados conforme a
        <a href="/termos#privacidade" target="_blank" rel="noopener">Política de Privacidade</a>.</span>
      </label>
      <div class="err" id="err"></div>
      <button class="cta" id="send">Ver meu resultado</button>
    </div>`;

  const zap = document.getElementById('zap');
  zap.addEventListener('input',()=>{ zap.value = maskPhone(zap.value); });

  document.getElementById('send').addEventListener('click',()=>{
    const nome = document.getElementById('nome').value.trim();
    const fone = document.getElementById('zap').value.trim();
    const ok   = document.getElementById('lgpd').checked;
    const err  = document.getElementById('err');
    if(nome.length < 2){ err.textContent = 'Digite seu nome pra continuar.'; return; }
    if(fone.replace(/\D/g,'').length < 10){ err.textContent = 'Confira seu número de WhatsApp.'; return; }
    if(!ok){ err.textContent = 'Marque o consentimento pra receber o convite.'; return; }
    err.textContent='';

    state.answers.nome = nome;
    state.answers.whatsapp = fone;

    // LEAD — o evento que, em produção, dispara no Pixel E na CAPI com o mesmo event_id
    const eventId = newEventId();
    track('quiz_complete', { answers: state.answers });
    track('lead', {
      event_id: eventId,           // <- chave de deduplicação Pixel <> CAPI
      profile: resolveProfile(state.answers).name,
      // em produção: nome/whatsapp hasheados (SHA-256) vão no user_data da CAPI
    });

    state.step++; render();
  });
}

function renderResult(){
  const p = resolveProfile(state.answers);
  backBtn.hidden = true;
  bar.style.width = '100%';
  stage.innerHTML = `
    <div class="step">
      <div class="badge"><span class="mark"></span>${p.name}</div>
      <h1>${state.answers.nome ? state.answers.nome.split(' ')[0]+',' : ''} seu lugar é aqui.</h1>
      <div class="result-card">
        <p>${p.line}</p>
        <ul class="perks">
          ${p.perks.map(x=>`<li><span class="tick">›</span><span>${x}</span></li>`).join('')}
        </ul>
      </div>
      <a class="cta" id="join" href="https://wa.me/554197783932?text=Quero%20entrar%20na%20comunidade%20Trader%20Elite" target="_blank" rel="noopener">Entrar na comunidade</a>
      <button class="cta ghost" id="restart">Refazer o quiz</button>
    </div>`;
  document.getElementById('join').addEventListener('click',()=>{
    track('community_click', { profile:p.name });
  });
  document.getElementById('restart').addEventListener('click',()=>{
    state.step=0; state.answers={}; render();
  });
}

/* ---- helpers ---- */
function maskPhone(v){
  v = v.replace(/\D/g,'').slice(0,11);
  if(v.length<=2) return v.replace(/(\d{0,2})/,'($1');
  if(v.length<=7) return v.replace(/(\d{2})(\d{0,5})/,'($1) $2');
  return v.replace(/(\d{2})(\d{5})(\d{0,4})/,'($1) $2-$3');
}

backBtn.addEventListener('click',()=>{
  if(state.step>0){ state.step--; render(); }
});

/* QUIZ_START — dispara na abertura da 1ª pergunta */
track('quiz_start', {});
state.started = true;
render();
</script>
</body>
</html>
